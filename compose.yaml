# docker compose up --build → http://localhost:8080
# With HTTPS on a public server: see compose.tls.yaml.
# The fine-tuned model is expected in ./models/laya-crete (build it with ml/train.py);
# the API runs as an unprivileged user, so the files must be readable for others (chmod -R a+rX models).
# Logs are rotated: at most 3 files of 5 MB per service (the privacy policy relies on it).
x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "3"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The public address, for canonical and language links.
        NUXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:8080}
        # Legal notice and privacy policy, from .env (see .env.example; .env is not committed).
        NUXT_PUBLIC_LEGAL_NAME: ${LEGAL_NAME:-}
        NUXT_PUBLIC_LEGAL_STREET: ${LEGAL_STREET:-}
        NUXT_PUBLIC_LEGAL_CITY: ${LEGAL_CITY:-}
        NUXT_PUBLIC_LEGAL_COUNTRY: ${LEGAL_COUNTRY:-}
        NUXT_PUBLIC_LEGAL_EMAIL: ${LEGAL_EMAIL:-}
        NUXT_PUBLIC_LEGAL_HOSTING: ${LEGAL_HOSTING:-}
    ports:
      # Local only by default; on a server put compose.tls.yaml (Caddy) in front instead.
      - "${CRETELAB_BIND:-127.0.0.1}:${CRETELAB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    build: services/api
    volumes:
      - ./models:/models:ro
    environment:
      LAYA_MODEL_DIR: /models/laya-crete
      # Descriptions the model works on at once; more only slows every one of them down.
      LAYA_MAX_PARALLEL: ${LAYA_MAX_PARALLEL:-2}
      # Threads per description: the CPU limit below.
      LAYA_THREADS: ${API_CPUS:-4}
    restart: unless-stopped
    cpus: ${API_CPUS:-4}
    mem_limit: ${API_MEM:-4g}
    security_opt: [no-new-privileges:true]
    logging: *logging

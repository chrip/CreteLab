[project]
name = "cretelab-api"
version = "2.0.0"
description = "CreteLab API: a fine-tuned Laya model answers typed questions about concrete projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# The model runtime. Tests use a fake predictor and need none of it.
model = ["laya>=0.3.21", "torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx2", "ruff>=0.8", "mypy>=1.13"]

# The container runs Laya on the CPU; the CPU wheels of PyTorch are a tenth of the CUDA ones.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "model" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cretelab_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Units and dimensions are written as people type them ("3×2 m", "0–3").
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Security headers for every response. nginx drops inherited add_header lines as soon as a
# location sets its own, so every location includes this file.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Only takes effect over HTTPS (browsers ignore it on plain HTTP).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content-Security-Policy with the hashes of Nuxt's inline scripts, written by scripts/csp.mjs.
include /etc/nginx/snippets/csp.conf;

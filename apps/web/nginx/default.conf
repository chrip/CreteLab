# Behind a TLS proxy (Caddy, see compose.tls.yaml) the client address comes from
# X-Forwarded-For, trusted only from private networks.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The model takes a few seconds per description on a CPU: 10 per minute and IP, short bursts allowed.
limit_req_zone $binary_remote_addr zone=describe:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

# Access logs without the last part of the IP address and without query strings (a shared
# planner link carries the description in ?q=), as the privacy policy states.
map $remote_addr $remote_addr_anon {
    ~(?P<ip>\d+\.\d+\.\d+)\.    $ip.0;
    ~(?P<ip>[^:]+:[^:]+:[^:]+):  $ip::;
    default                     0.0.0.0;
}
log_format anon '$remote_addr_anon - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

# Language for a visit to the bare domain: the saved choice (the cookie the site sets when
# someone switches), else the browser's first of German and English, else German. Link
# preview crawlers send no language and get the German page.
map $cookie_cretelab_locale $saved_locale {
    ~^(de|en)$  $1;
    default     "";
}
map $http_accept_language $browser_locale {
    ~*^\s*de     de;
    ~*^\s*en     en;
    ~*(^|,)\s*de de;
    ~*(^|,)\s*en en;
    default      de;
}
map $saved_locale $root_locale {
    ""      $browser_locale;
    default $saved_locale;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log anon;
    # Error messages contain full client addresses; only critical errors are logged.
    error_log /var/log/nginx/error.log crit;
    server_tokens off;

    # Relative redirects keep the port the browser used (the container itself listens on 80).
    absolute_redirect off;

    error_page 404 /404.html;

    # The model service; only /api is exposed, nothing else of it.
    location /api/ {
        limit_req zone=describe burst=10 nodelay;
        limit_conn perip 4;
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
        include /etc/nginx/snippets/security.conf;
    }

    # Hashed build assets never change.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security.conf;
    }

    location = / {
        add_header Vary "Accept-Language, Cookie" always;
        add_header Cache-Control "private, no-store" always;
        return 302 /$root_locale;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        include /etc/nginx/snippets/security.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

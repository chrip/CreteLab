server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects keep the port the browser used (the container itself listens on 80).
    absolute_redirect off;

    # The model service; only /api is exposed, nothing else of it.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Hashed build assets never change.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        return 302 /de;
    }

    # The page used to be called the decor workshop; keep old links working.
    location ~ ^/(de|en)/decor/?$ {
        return 301 /$1/fine-concrete$is_args$args;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
